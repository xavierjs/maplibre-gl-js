<!DOCTYPE html>
<html lang="en">
<head>
  <title>Repro Brady</title>
  <meta property="og:description" content="Use extrusions to display buildings' height in 3D." />
  <meta charset='utf-8'>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel='stylesheet' href='../../dist/maplibre-gl.css' />
  <style>
      body { margin: 0; padding: 0; }
      html, body, #map { height: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script type="module">
  import * as maplibregl from '../../dist/maplibre-gl-dev.mjs';

  maplibregl.setWorkerUrl('../../dist/maplibre-gl-worker-dev.mjs');

  const SOURCE = `https://raw.githubusercontent.com/bradymadden97/maplibre-tools/refs/heads/main/sources/faa-airports.geojson`;
  const map = new maplibregl.Map({
    container: "map",
    style: `https://tiles.openfreemap.org/styles/bright`,
    center: [-86.158, 39.7691],
    zoom: 2,
  });
  globalThis.map = map;

  map.on("load", async () => {
    // Add some more fake properties to each to highlight slow read path
    const data = await fetch(SOURCE).then((r) => r.json());
    for (const feature of data.features) {
      for (let i = 0; i < 50; i++) {
        feature.properties[`fake-${i}`] = "" + Math.random() + Math.random();
      }
    }

    // Add geojson source
    map.addSource("airports", { data, promoteId: "pk", type: "geojson" });

    // Add icon layer
    map.addLayer({
      id: "airport-icons",
      type: "symbol",
      source: "airports",
      layout: {
        "icon-allow-overlap": true,
        "icon-ignore-placement": true,
        "icon-image": "airport",
        "icon-size": 1,
      },
    });

    // Add feature-state-dependent layer
    map.addLayer({
      id: "airport-circle",
      type: "circle",
      source: "airports",
      paint: {
        "circle-color": "rgba(0,0,0,0)",
        "circle-radius": 16,
        "circle-stroke-color": "#ff9800",
        "circle-stroke-opacity": [
          "case",
          ["boolean", ["feature-state", "hover"], false],
          1,
          0,
        ],
        "circle-stroke-width": 2,
      },
    });

    // Mark and unmark every airport to populate a large feature state
    for (const i of data.features) {
      map.setFeatureState(
        { source: "airports", id: i.properties.pk },
        { hover: true }
      );
      map.removeFeatureState({ source: "airports", id: i.properties.pk });
    }

    // Initially load tiles at each level
    await zoomAndWaitForLoad(map, 5, 1000);
    await zoomAndWaitForLoad(map, 6, 500);
    await zoomAndWaitForLoad(map, 7, 500);


    document.getElementById('but').addEventListener('click', start);
    document.getElementById('but').style.display="block";
  });

  async function zoomAndWaitForLoad(map, level, duration) {
    map.zoomTo(level, { duration });
    do {
      await new Promise((r) => setTimeout(r, duration));
    } while (!map.areTilesLoaded());
  }

  async function start(){
    // Loop and exhibit slow behavior
    let i = 0;
    while (i < 5) {
      await zoomAndWaitForLoad(map, 6, 500);
      await zoomAndWaitForLoad(map, 5, 500);
      await zoomAndWaitForLoad(map, 6, 500);
      await zoomAndWaitForLoad(map, 7, 500);
      i++;
    }
  }

</script>
<button style="position: fixed; display: none; top: 10px; left: 10px; z-index:1000" id="but">ZOOM AND DEZOOM</button>
</body>
</html>
